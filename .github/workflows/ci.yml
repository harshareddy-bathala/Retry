name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: retry
          POSTGRES_PASSWORD: retry
          POSTGRES_DB: retry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retry"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://retry:retry@localhost:5432/retry_test
      DATABASE_URL_TEST: postgresql://retry:retry@localhost:5432/retry_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `packages/maps/generated/` is gitignored, so it does not exist in a
      # fresh clone and every `@retry/maps/generated/*` import fails to resolve
      # without this step.
      #
      # The pack itself IS committed now (this repository is private — see
      # docs/assets-setup.md), so this builds the real art rather than the
      # typed stubs it used to emit. The stub path still exists for clones
      # without the pack; it is simply not what CI exercises any more.
      - name: Build art
        run: pnpm --filter @retry/maps assets:build

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Migrate test database
        run: pnpm --filter @retry/db migrate

      # Rooms map contract: required layers + default spawn (packages/maps/README.md)
      - name: Validate maps
        run: pnpm --filter @retry/maps validate

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

      # Hard Rule 7 tripwire: raw-SQL template interpolation outside placeholders
      - name: Guard raw SQL interpolation
        run: |
          if grep -rn '\${' packages/db/src/queries --include='*.ts' 2>/dev/null; then
            echo '::error::String interpolation found in raw SQL files (SECURITY.md §3)'
            exit 1
          fi
