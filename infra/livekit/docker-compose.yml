# The LiveKit box, whole. Two containers: the SFU and a TLS terminator.
#
#   cd /opt/retry-livekit && docker compose up -d
#
# Runs on its own VPS, not the application droplet: the SFU wants UDP, a public
# IP and CPU headroom that spikes with concurrent publishers, and a busy Live
# Space must never be able to starve the API.

services:
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    # Deliberate: the 10,000-port UDP media range makes per-port publishing
    # impractical, and host networking is also how use_external_ip discovers
    # the real address for ICE.
    network_mode: host
    volumes:
      - /etc/livekit:/etc/livekit
    command: --config /etc/livekit/livekit.yaml

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - /etc/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - /etc/livekit/tls:/certs-out
      - /var/log/caddy:/var/log/caddy

volumes:
  caddy-data:
  caddy-config:
